[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bizbazaar-api"
version = "0.1.0"
description = "BizBazaar merchant API and deterministic simulated campaign engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.129,<0.130",
  "uvicorn>=0.41,<0.42",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.22,<0.1",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<48",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<0.29", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bizbazaar-analytics"
version = "0.1.0"
description = "Exact merchant analytics, transparent forecasts and grounded summaries for BizBazaar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pandas>=2,<4",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bizbazaar_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
